<title>School of Materials &amp; Design | Technical Record</title>
<style>
:root{--ink:#111;--muted:#6b6b6b;--line:#d8d8d8;--paper:#fff;--bg:#f2f2f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.sheet{max-width:920px;margin:28px auto;background:#fff;padding:34px 38px 44px;box-shadow:0 2px 18px #00000012}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;border-bottom:2px solid #111;padding-bottom:18px;margin-bottom:26px}
.logo{width:min(430px,58%);height:auto;filter:invert(1)}
h1{font-size:30px;margin:4px 0 0;letter-spacing:-.5px}.kicker{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#555}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label,.label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid #bbb;border-radius:5px;background:white;padding:11px;font:inherit}
textarea{resize:vertical;min-height:90px}
.block{margin:22px 0}.hero{margin-top:20px}
.upload{border:1.5px dashed #999;border-radius:7px;padding:15px;text-align:center;background:#fafafa}
.upload input{border:0;padding:4px;background:transparent}
.preview{display:none;width:100%;max-height:430px;object-fit:contain;margin-top:12px;border-radius:4px}
.section-title{font-size:19px;margin:30px 0 14px;padding-top:8px;border-top:1px solid #bbb}
.step{border:1px solid var(--line);border-radius:7px;padding:16px;margin:12px 0;background:#fff}
.step-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.step-grid{display:grid;grid-template-columns:42% 1fr;gap:15px}
button{border:0;border-radius:5px;padding:11px 15px;font-weight:700;cursor:pointer}
.add{background:#111;color:#fff}.remove{background:#eee;color:#333;padding:7px 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:2px solid #111}
.actions button{background:#111;color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.reflection{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.reflection .wide{grid-column:1/-1}
@media(max-width:650px){
 .sheet{margin:0;padding:22px 18px;box-shadow:none}
 header{display:block}.logo{width:100%;max-width:390px;margin-bottom:20px}
 .grid2,.step-grid,.reflection{grid-template-columns:1fr}
 .reflection .wide{grid-column:auto}
 h1{font-size:26px}
}
@page{size:A4;margin:12mm}
@media print{
 body{background:#fff}.sheet{max-width:none;margin:0;padding:0;box-shadow:none}
 .actions,.add,.remove,.note,input[type=file]{display:none!important}
 header{break-after:avoid}.step{break-inside:avoid}
 input,select,textarea{border:0;border-bottom:1px solid #bbb;border-radius:0;padding:5px 0}
 textarea{min-height:55px}
 .upload{border:0;padding:0;background:#fff}
 .preview{max-height:70mm}
}
</style>
</head>

      <div><label>What did you do at this stage?</label><textarea placeholder="Briefly explain the process, settings, decisions or observations."></textarea></div>
    </div>
  </section>
</div>

<button type="button" class="add" id="addBtn" onclick="addStep()" style="display: inline-block;">+ Add another process step</button>

<h2 class="section-title">Review</h2>
<section class="reflection">
 <div><label>What was successful?</label><textarea></textarea>
 <div class="upload"><input type="file" accept="image/*" capture="environment" onchange="showImage(this,'successPreview')"><img id="successPreview" class="preview"></div></div>
 <div><label>What was challenging?</label><textarea></textarea>
 <div class="upload"><input type="file" accept="image/*" capture="environment" onchange="showImage(this,'challengePreview')"><img id="challengePreview" class="preview"></div></div>
 <div class="wide"><label>What would you like to test further, repeat or iterate?</label><textarea></textarea></div>
</section>

<div class="actions">
 <button type="button" onclick="window.print()">Save / Print A4</button>
 <button type="button" onclick="clearForm()">Clear record</button>
</div>
<p class="note">Use your browser's print dialog and choose “Save as PDF” for a digital A4 copy.</p>
</main>

<script>
function showImage(input,id){
 const file=input.files && input.files[0];
 if(!file) return;
 const img=document.getElementById(id);
 img.src=URL.createObjectURL(file);
 img.style.display='block';
}

let nextStepId=4;

function renumberSteps(){
 const steps=[...document.querySelectorAll('#steps .step')];
 steps.forEach((el,i)=>{
   el.querySelector('.step-head span').textContent='Process step '+(i+1);
 });
 nextStepId=steps.length+1;
 document.getElementById('addBtn').style.display=steps.length>=8?'none':'inline-block';
}

function addStep(){
 const steps=document.querySelectorAll('#steps .step');
 if(steps.length>=8) return;

 const id=nextStepId++;
 const wrap=document.createElement('section');
 wrap.className='step';
 wrap.innerHTML=`<div class="step-head"><span>Process step ${steps.length+1}</span><button class="remove" type="button" onclick="removeStep(this)">Remove</button></div>
 <div class="step-grid">
   <div class="upload"><input type="file" accept="image/*" capture="environment" onchange="showImage(this,'stepPreview${id}')"><img id="stepPreview${id}" class="preview"></div>
   <div><label>What did you do at this stage?</label><textarea placeholder="Briefly explain the process, settings, decisions or observations."></textarea></div>
 </div>`;
 document.getElementById('steps').appendChild(wrap);
 renumberSteps();
}

function removeStep(btn){
 btn.closest('.step').remove();
 renumberSteps();
}

function clearForm(){
 if(!confirm('Clear everything from this Technical Record?')) return;
 document.querySelectorAll('input[type=text],textarea').forEach(e=>e.value='');
 document.querySelectorAll('input[type=file]').forEach(e=>e.value='');
 document.querySelectorAll('.preview').forEach(e=>{e.src='';e.style.display='none'});
 const steps=[...document.querySelectorAll('#steps .step')];
 steps.slice(3).forEach(e=>e.remove());
 renumberSteps();
}

renumberSteps();
</script>
</body></html>
